<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Plot Known Route from Coordinates</title>
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />

  <!-- ArcGIS Maps SDK for JavaScript -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>

  <style>
    html, body, #viewDiv {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="viewDiv"></div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/Graphic",
      "esri/layers/GraphicsLayer",
      "esri/geometry/Polyline"
    ], (Map, MapView, Graphic, GraphicsLayer, Polyline) => {

      // 1️⃣ Create the map and view
      const map = new Map({
        basemap: "streets-navigation-vector"
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-98, 39], // Default center
        zoom: 4
      });

      const graphicsLayer = new GraphicsLayer();
      map.add(graphicsLayer);

      // 2️⃣ Define your route coordinates here (replace with your CSV data)
      // CSV rows might look like: lat,lon
      // Example CSV data converted to lon/lat pairs:
      const routeCoordinates = [
        [-122.45, 37.77],  // San Francisco sample points
        [-122.43, 37.76],
        [-122.41, 37.75],
        [-122.40, 37.74]
      ];

      // 3️⃣ Create a Polyline from these coordinates
      const polyline = new Polyline({
        paths: [routeCoordinates],
        spatialReference: { wkid: 4326 }
      });

      // 4️⃣ Define the style for the route
      const polylineSymbol = {
        type: "simple-line",
        color: [226, 119, 40], // orange
        width: 4
      };

      // 5️⃣ Add it as a graphic
      const polylineGraphic = new Graphic({
        geometry: polyline,
        symbol: polylineSymbol
      });

      graphicsLayer.add(polylineGraphic);

      // 6️⃣ Optionally zoom to the route
      view.when(() => {
        view.goTo(polylineGraphic.geometry.extent.expand(1.5));
      });
    });
  </script>
</body>
</html>
